[project]
name = "inai-backend"
version = "0.1.0"
description = "Inai MVP backend (FastAPI). See .kiro/specs/inai-mvp/ for requirements and design."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
# Approved M1 stack. Versions are pinned by uv.lock, which must be generated with
# `uv lock` once package-index access is available (blocked in the current sandbox).
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2,<3",
    "alembic",
    "firebase-admin",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inai_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "spike: exploratory characterisation tests for validation spikes",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["inai_backend"]
